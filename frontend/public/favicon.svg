<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Finance Letter F App Icon</title>
  <desc id="desc">A white flowing letter F on an edge-to-edge vivid blue gradient.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38A8F5"/>
      <stop offset=".48" stop-color="#1554F5"/>
      <stop offset="1" stop-color="#22B7F2"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#61C8F8" stop-opacity=".62"/>
      <stop offset="1" stop-color="#1472F5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lowerWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#083BE8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#50C5F5" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF1FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="10" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.12 0 0 0 0 0.45 0 0 0 .25 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="1024" height="1024" rx="190"/></clipPath>
  </defs>
  <g>
    <rect width="1024" height="1024" fill="url(#base)"/>
    <path d="M-30 185C180 35 420 20 780 35L610 260C480 395 285 345-30 570Z" fill="url(#wave)"/>
    <path d="M-20 790C175 610 335 635 510 790C675 930 835 875 1050 735V1060H-20Z" fill="url(#lowerWave)" opacity=".72"/>
    <path d="M250 1025C360 845 530 820 730 790C865 770 970 720 1060 650V1060H250Z" fill="#43B8F4" opacity=".16"/>
    <path d="M270 800C270 620 270 470 270 430C270 286 365 205 515 205H870C860 305 790 370 690 370H545C425 370 345 435 300 555C350 475 425 450 530 450H790C780 530 720 585 635 585H500V650C500 735 425 800 330 800Z" fill="url(#letter)" filter="url(#shadow)" transform="translate(0 0)"/>
  </g>
</svg>
